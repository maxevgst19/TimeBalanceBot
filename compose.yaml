services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://timebalance:timebalance_dev@postgres:5432/timebalance
      HOST: 0.0.0.0
      PORT: 8000
      ENABLE_BOT: ${ENABLE_BOT:-true}
      ENABLE_NOTIFIER: ${ENABLE_NOTIFIER:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timebalance
      POSTGRES_USER: timebalance
      POSTGRES_PASSWORD: timebalance_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timebalance -d timebalance"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
