services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timebalance
      POSTGRES_USER: timebalance
      POSTGRES_PASSWORD: timebalance_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timebalance -d timebalance"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
