<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Календарь Mini App</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.09);
      --modal-bg: #141a29;
      --input-bg: rgba(255, 255, 255, 0.06);
      --tag-study: #a855f7;
      --tag-work: #38bdf8;
      --tag-sport: #34d399;
      --tag-urgent: #fb7185;
      --active-day-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --active-day-color: #ffffff;
      --today-border: #6366f1;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(0, 0, 0, 0.07);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.25);
      --surface: rgba(0, 0, 0, 0.04);
      --surface-hover: rgba(0, 0, 0, 0.07);
      --modal-bg: #ffffff;
      --input-bg: rgba(0, 0, 0, 0.04);
      --active-day-bg: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --active-day-color: #ffffff;
      --today-border: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title-block h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .header-title-block p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .theme-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .theme-toggle-btn:active {
      transform: scale(0.92);
    }

    .theme-toggle-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Common Card Styling */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Calendar Block */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .current-month-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-transform: capitalize;
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: var(--surface-hover);
    }

    .nav-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 8px;
    }

    .weekday {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px 2px;
    }

    .day-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-cell.other-month {
      opacity: 0.2;
      cursor: default;
    }

    .day-cell:not(.other-month):active {
      transform: scale(0.92);
    }

    .day-number {
      font-size: 13px;
      font-weight: 500;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .day-cell.today .day-number {
      border: 2px solid var(--today-border);
      font-weight: 700;
    }

    .day-cell.selected .day-number {
      background: var(--active-day-bg);
      color: var(--active-day-color);
      box-shadow: 0 4px 12px var(--accent-glow);
      font-weight: 700;
    }

    .day-dots {
      display: flex;
      gap: 3px;
      margin-top: 1px;
      height: 4px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
    }

    .dot.study { background-color: var(--tag-study); }
    .dot.work { background-color: var(--tag-work); }
    .dot.sport { background-color: var(--tag-sport); }
    .dot.urgent { background-color: var(--tag-urgent); }

    /* Legend */
    .legend-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Tasks / Day Schedule Section */
    .tasks-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .tasks-title-block h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-transform: capitalize;
    }

    .tasks-stats {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid var(--card-border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      width: 0%;
      border-radius: 3px;
      transition: width 0.35s ease;
    }

    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      position: relative;
    }

    .task-card:active {
      transform: scale(0.99);
    }

    .task-card.completed {
      opacity: 0.45;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 12px;
      min-width: 56px;
    }

    .task-time {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .task-dur {
      font-size: 10px;
      color: var(--text-muted);
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      width: fit-content;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .badge-study { color: var(--tag-study); background: rgba(168, 85, 247, 0.14); }
    .badge-work { color: var(--tag-work); background: rgba(56, 189, 248, 0.14); }
    .badge-sport { color: var(--tag-sport); background: rgba(52, 211, 153, 0.14); }
    .badge-urgent { color: var(--tag-urgent); background: rgba(251, 113, 133, 0.14); }

    .task-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      background: transparent;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .check-btn.checked {
      background: #10b981;
      border-color: #10b981;
      color: white;
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Floating Action Button (+) */
    .fab-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px var(--accent-glow);
      cursor: pointer;
      z-index: 50;
      transition: transform 0.15s ease, box-shadow 0.2s;
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    .fab-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
    }

    /* Modal Sheet for Adding Task */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 480px;
      margin: 0 auto;
      background: var(--modal-bg);
      border-top: 1px solid var(--card-border);
      border-radius: 28px 28px 0 0;
      padding: 16px 20px 32px 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-sheet.active {
      transform: translateY(0);
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--text-muted);
      opacity: 0.35;
      border-radius: 2px;
      margin: 0 auto 4px auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-input {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .category-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-pill {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .cat-pill.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.15);
      color: var(--text-main);
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: transform 0.1s ease;
      margin-top: 6px;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title-block">
        <h1>Календарь</h1>
        <p>События и напоминания</p>
      </div>
      <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Сменить тему">
        <svg id="themeIcon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </header>

    <!-- Month Calendar Card -->
    <div class="glass-card">
      <div class="month-nav">
        <div class="current-month-label" id="currentMonthYear">Ноябрь 2026</div>
        <div class="nav-buttons">
          <button class="nav-btn" id="prevMonthBtn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="nav-btn" id="nextMonthBtn">
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="weekdays-grid">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
      </div>

      <div class="days-grid" id="daysGrid"></div>

      <!-- Categories Legend -->
      <div class="legend-bar">
        <div class="legend-item"><div class="legend-dot" style="background: var(--tag-study);"></div>Учёба</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--tag-work);"></div>Проекты</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--tag-sport);"></div>Спорт</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--tag-urgent);"></div>Важное</div>
      </div>
    </div>

    <!-- Visible Tasks / Day Schedule -->
    <section class="tasks-section">
      <div class="tasks-header">
        <div class="tasks-title-block">
          <h2 id="selectedDateTitle">3 ноября, вторник</h2>
          <div class="progress-track">
            <div class="progress-fill" id="tasksProgressFill"></div>
          </div>
        </div>
        <div class="tasks-stats" id="tasksStats">0 из 0</div>
      </div>

      <div class="tasks-list" id="tasksList"></div>
    </section>
  </div>

  <!-- Floating Add Button (+) -->
  <button class="fab-btn" id="fabBtn" aria-label="Добавить задачу">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <!-- Add Task Modal Sheet -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Новое напоминание</div>
      <button class="close-modal-btn" id="closeModalBtn">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Название</label>
      <input type="text" id="taskTitleInput" class="form-input" placeholder="Напр.: Программирование / ДЗ" required>
    </div>

    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div>
        <label class="form-label">Время</label>
        <input type="time" id="taskTimeInput" class="form-input" value="18:00">
      </div>
      <div>
        <label class="form-label">Длительность</label>
        <input type="text" id="taskDurInput" class="form-input" value="1.5ч">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Категория</label>
      <div class="category-pills" id="categoryPills">
        <div class="cat-pill active" data-cat="study"><span class="legend-dot" style="background: var(--tag-study);"></span>Учёба</div>
        <div class="cat-pill" data-cat="work"><span class="legend-dot" style="background: var(--tag-work);"></span>Проекты</div>
        <div class="cat-pill" data-cat="sport"><span class="legend-dot" style="background: var(--tag-sport);"></span>Спорт</div>
        <div class="cat-pill" data-cat="urgent"><span class="legend-dot" style="background: var(--tag-urgent);"></span>Важное</div>
      </div>
    </div>

    <button class="submit-btn" id="saveTaskBtn">Сохранить событие</button>
  </div>

      ],
      "2026-11-12": [
        { id: 12, title: "Дедлайн по спринту", time: "19:00", duration: "1ч", category: "urgent", completed: false }
      ]
    };

    let currentDate = new Date(2026, 10, 1); // November 2026
    let selectedDateStr = "2026-11-03";
    let isDark = true;
    let selectedCategory = "study";

    // DOM Elements
    const daysGrid = document.getElementById('daysGrid');
    const currentMonthYear = document.getElementById('currentMonthYear');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const tasksProgressFill = document.getElementById('tasksProgressFill');
    const tasksStats = document.getElementById('tasksStats');
    const tasksList = document.getElementById('tasksList');
    const fabBtn = document.getElementById('fabBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalSheet = document.getElementById('modalSheet');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveTaskBtn = document.getElementById('saveTaskBtn');
    const taskTitleInput = document.getElementById('taskTitleInput');
    const taskTimeInput = document.getElementById('taskTimeInput');
    const taskDurInput = document.getElementById('taskDurInput');
    const categoryPills = document.querySelectorAll('.cat-pill');

    const monthsRu = [
      "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
      "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];

    const categoryNames = {
      study: "Учёба",
      work: "Проекты",
      sport: "Спорт",
      urgent: "Важное"
    };

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      currentMonthYear.textContent = `${monthsRu[month]} ${year}`;

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      // Russian locale: Monday is 0
      let startDayOfWeek = firstDayOfMonth.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const totalDays = lastDayOfMonth.getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      daysGrid.innerHTML = '';

      // Previous month days
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerHTML = `<span class="day-number">${prevMonthLastDay - i}</span>`;
        daysGrid.appendChild(cell);
      }

      // Current month days
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        if (dateStr === "2026-11-03") {
          cell.classList.add('today');
        }

        if (dateStr === selectedDateStr) {
          cell.classList.add('selected');
        }

        let dotsHtml = '';
        if (mockEvents[dateStr] && mockEvents[dateStr].length > 0) {
          dotsHtml = '<div class="day-dots">';
          const cats = [...new Set(mockEvents[dateStr].map(e => e.category))];
          cats.slice(0, 3).forEach(cat => {
            dotsHtml += `<div class="dot ${cat}"></div>`;
          });
          dotsHtml += '</div>';
        }

        cell.innerHTML = `<span class="day-number">${day}</span>${dotsHtml}`;

        cell.addEventListener('click', () => {
          document.querySelectorAll('.day-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          selectedDateStr = dateStr;
          renderTasksSection();
        });

        daysGrid.appendChild(cell);
      }

      // Remaining days
      const totalCells = startDayOfWeek + totalDays;
      const remainingSlots = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remainingSlots; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell other-month';
        cell.innerHTML = `<span class="day-number">${i}</span>`;
        daysGrid.appendChild(cell);
      }
    }

    function renderTasksSection() {
      const [y, m, d] = selectedDateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const options = { day: 'numeric', month: 'long', weekday: 'long' };
      const formattedTitle = dateObj.toLocaleDateString('ru-RU', options);

      selectedDateTitle.textContent = formattedTitle.charAt(0).toUpperCase() + formattedTitle.slice(1);

      const events = mockEvents[selectedDateStr] || [];
      const total = events.length;
      const completed = events.filter(e => e.completed).length;

      tasksStats.textContent = `${completed} из ${total} выполнено`;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      tasksProgressFill.style.width = `${percent}%`;

      tasksList.innerHTML = '';
      if (total === 0) {
        tasksList.innerHTML = `<div class="empty-state">Нет запланированных дел на этот день. Нажмите <b>+</b>, чтобы добавить!</div>`;
      } else {
        events.forEach(evt => {
          const card = document.createElement('div');
          card.className = `task-card ${evt.completed ? 'completed' : ''}`;
          card.innerHTML = `
            <div class="task-left">
              <div class="task-time-box">
                <span class="task-time">${evt.time}</span>
                <span class="task-dur">${evt.duration}</span>
              </div>
              <div class="task-info">
                <span class="task-badge badge-${evt.category}">${categoryNames[evt.category]}</span>
                <span class="task-title">${evt.title}</span>
              </div>
            </div>
            <button class="check-btn ${evt.completed ? 'checked' : ''}" data-id="${evt.id}">
              ✓
            </button>
          `;

          const checkBtn = card.querySelector('.check-btn');
          checkBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            evt.completed = !evt.completed;
            checkBtn.classList.toggle('checked', evt.completed);
            card.classList.toggle('completed', evt.completed);
            
            // Recalculate stats
            const newComp = events.filter(ev => ev.completed).length;
            tasksStats.textContent = `${newComp} из ${total} выполнено`;
            tasksProgressFill.style.width = `${Math.round((newComp / total) * 100)}%`;
          });

          tasksList.appendChild(card);
        });
      }
    }

    // Modal Sheet Handlers
    function openModal() {
      taskTitleInput.value = '';
      modalOverlay.classList.add('active');
      modalSheet.classList.add('active');
      taskTitleInput.focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalSheet.classList.remove('active');
    }

    categoryPills.forEach(pill => {
      pill.addEventListener('click', () => {
        categoryPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedCategory = pill.getAttribute('data-cat');
      });
    });

    saveTaskBtn.addEventListener('click', () => {
      const title = taskTitleInput.value.trim();
      if (!title) {
        taskTitleInput.focus();
        return;
      }
      const time = taskTimeInput.value || "12:00";
      const duration = taskDurInput.value.trim() || "1ч";

      if (!mockEvents[selectedDateStr]) {
        mockEvents[selectedDateStr] = [];
      }

      mockEvents[selectedDateStr].push({
        id: Date.now(),
        title,
        time,
        duration,
        category: selectedCategory,
        completed: false
      });

      closeModal();
      renderCalendar();
      renderTasksSection();
    });

    fabBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);

    // Month Navigation
    prevMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    // Theme Switcher
    function updateThemeIcons() {
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeIcon.innerHTML = `
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        `;
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      updateThemeIcons();
    });

    // Initial load
    renderCalendar();
    renderTasksSection();
  </script>
</body>
</html>
