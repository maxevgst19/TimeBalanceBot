openapi: 3.1.0
info:
  title: TimeBalance API
  version: 0.1.0
  description: |
    Контракт собственного Python-бэкенда мини-приложения TimeBalance в MAX.
    Это не спецификация MAX Bot API. Все даты передаются в ISO 8601,
    моменты времени — с часовым поясом. Длительности задаются в минутах.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Profile
  - name: Events
  - name: Tasks
  - name: Planning
  - name: Data
security:
  - bearerAuth: []
paths:
  /auth/max:
    post:
      tags: [Auth]
      security: []
      summary: Обмен проверенных данных запуска MAX на сессию приложения
      description: |
        Клиент передаёт строку window.WebApp.initData, а не initDataUnsafe.
        Сервер проверяет подпись с MAX_BOT_TOKEN, срок auth_date и отсутствие
        повторяющихся параметров. Токен MAX никогда не отправляется клиенту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, user]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer, minimum: 1, description: Секунды }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me:
    get:
      tags: [Profile]
      summary: Профиль и настройки текущего пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Обновить личные границы и уведомления
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /events:
    get:
      tags: [Events]
      summary: События в диапазоне дат
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: События, включая экземпляры повторений
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Events]
      summary: Добавить урок, кружок или другое событие
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Событие создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    patch:
      tags: [Events]
      summary: Изменить событие
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
      responses:
        '200':
          description: Изменённое событие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Events]
      summary: Удалить событие
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks:
    get:
      tags: [Tasks]
      summary: Задачи до указанной даты
      parameters:
        - name: due_before
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: Задачи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [Tasks]
      summary: Добавить задание
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Изменить задание или его статус
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPatch' }
      responses:
        '200':
          description: Изменённая задача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Удалить задание
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/NotFound' }
  /plan:
    get:
      tags: [Planning]
      summary: Рассчитанный план дня или недели
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: План, свободные окна и конфликты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /plan/next-action:
    get:
      tags: [Planning]
      summary: Следующий выполнимый шаг
      responses:
        '200':
          description: Следующий шаг или отдых
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextAction' }
  /plan/alternatives:
    post:
      tags: [Planning]
      summary: Сформировать варианты «Плана Б» без изменения данных
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conflict_id, plan_revision]
              properties:
                conflict_id: { type: string, format: uuid }
                plan_revision: { type: string }
      responses:
        '200':
          description: Варианты с прогнозом последствий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alternative' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plan/alternatives/{alternativeId}/apply:
    post:
      tags: [Planning]
      summary: Применить выбранный вариант и пересчитать план
      parameters:
        - name: alternativeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_revision]
              properties:
                plan_revision: { type: string }
      responses:
        '200':
          description: Новый план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/data:
    delete:
      tags: [Data]
      summary: Удалить личные данные пользователя
      description: Удаляет профиль, события, задачи и настройки после подтверждения в интерфейсе.
      responses:
        '204': { description: Данные удалены }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
      description: Включительно; диапазон не более 31 дня.
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Неверная или истёкшая сессия
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Объект не найден у текущего пользователя
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: План изменился; нужно запросить новые варианты
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Ошибка входных данных
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    User:
      type: object
      required: [id, settings]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        settings: { $ref: '#/components/schemas/Settings' }
    Settings:
      type: object
      required: [timezone, day_end, break_after_school_min, notifications_enabled]
      properties:
        timezone: { type: string, example: Europe/Moscow }
        day_end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '21:00' }
        break_after_school_min: { type: integer, minimum: 0, maximum: 180 }
        notifications_enabled: { type: boolean }
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        timezone: { type: string }
        day_end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        break_after_school_min: { type: integer, minimum: 0, maximum: 180 }
        notifications_enabled: { type: boolean }
    EventInput:
      type: object
      required: [title, category, starts_at, ends_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [school, extra, personal] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        travel_before_min: { type: integer, minimum: 0, maximum: 240, default: 0 }
        travel_after_min: { type: integer, minimum: 0, maximum: 240, default: 0 }
        movable: { type: boolean, default: false }
        recurrence:
          type: object
          description: Если не задано, событие разовое.
          required: [weekdays]
          properties:
            weekdays:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 1, maximum: 7 }
            until: { type: string, format: date }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            series_starts_at:
              type: string
              format: date-time
              nullable: true
              description: Начало серии для экземпляров повторяющегося события.
    EventPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [school, extra, personal] }
        recurrence:
          type: object
          required: [weekdays]
          properties:
            weekdays:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 1, maximum: 7 }
            until: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        travel_before_min: { type: integer, minimum: 0, maximum: 240 }
        travel_after_min: { type: integer, minimum: 0, maximum: 240 }
        movable: { type: boolean }
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
    TaskInput:
      type: object
      required: [title, due_at, estimated_min]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        due_at: { type: string, format: date-time }
        estimated_min: { type: integer, minimum: 5, maximum: 480 }
        splittable: { type: boolean, default: true }
        priority: { type: string, enum: [normal, high], default: normal }
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskInput'
        - type: object
          required: [id, status, spent_min, started_at_ms]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/TaskStatus' }
            spent_min: { type: integer, minimum: 0 }
            started_at_ms: { type: integer, minimum: 0 }
    TaskPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        due_at: { type: string, format: date-time }
        estimated_min: { type: integer, minimum: 5, maximum: 480 }
        splittable: { type: boolean }
        priority: { type: string, enum: [normal, high] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        spent_min: { type: integer, minimum: 0 }
        started_at_ms: { type: integer, minimum: 0 }
    TimeBlock:
      type: object
      required: [kind, starts_at, ends_at, title]
      properties:
        kind: { type: string, enum: [event, task, travel, break, free] }
        source_id: { type: [string, 'null'], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        title: { type: string }
    Plan:
      type: object
      required: [revision, from, to, blocks, conflicts, free_min, planned_min]
      properties:
        revision: { type: string, description: Меняется при каждой правке исходных данных. }
        from: { type: string, format: date }
        to: { type: string, format: date }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/TimeBlock' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/PlanConflict' }
        free_min: { type: integer, minimum: 0 }
        planned_min: { type: integer, minimum: 0 }
    PlanConflict:
      type: object
      required: [id, type, shortage_min, explanation]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [time_shortage, overlap, deadline] }
        shortage_min: { type: integer, minimum: 0 }
        explanation: { type: string }
        affected_task_ids:
          type: array
          items: { type: string, format: uuid }
    NextAction:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [task, event, rest] }
        title: { type: string }
        task_id: { type: [string, 'null'], format: uuid }
        suggested_min: { type: integer, minimum: 0 }
        starts_at: { type: string, format: date-time }
    Alternative:
      type: object
      required: [id, title, explanation, changes, remaining_shortage_min]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        explanation: { type: string }
        changes:
          type: array
          items: { type: string, description: Человекочитаемое описание изменения. }
        remaining_shortage_min: { type: integer, minimum: 0 }
